# Same-origin reverse proxy: the SPA calls /api/v1/... and Nginx forwards it to the
# backend container by its Compose service name. The browser never needs to resolve
# "backend". Prefixes are passed through unchanged (no trailing slash on proxy_pass).
upstream traffix_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://traffix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live YOLO inference on CPU can take a few seconds on first call.
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://traffix_backend;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://traffix_backend;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
